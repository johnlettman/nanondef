[package]
name = "nanondef-wasm"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["tracing", "panic-hook"]

tracing = ["nanondef/tracing", "dep:tracing", "dep:wasm-tracing"]
panic-hook = ["dep:console_error_panic_hook"]



[dependencies]
nanondef = { path = "..", features = ["alloc", "serde", "wasm"], default-features = false }

thiserror = "2.0"
tracing = { version = "0.1", features = ["attributes"], optional = true }
wasm-tracing = { version = "2.1", features = ["tracing-log"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }


wasm-bindgen = { version = "0.2", features = ["serde"] }
serde-wasm-bindgen = { version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"


js-sys = { version = "0.3" }
